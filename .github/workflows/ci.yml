name: CI

# Catches watch-list regressions at the moment they're introduced, rather than
# discovering months later that an item silently never alerted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate deal-hunter watch list
        run: npm run validate:watchlist
